<!DOCTYPE html>
<html lang="en">
    
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub Portal - Login</title>
</head>
<body>
  <header>
    <img src="student.png" height="100" width="100" alt="Student">
    <h1>StudentHub</h1>
    <nav>
      <ul>
        <li><a href="Home.html">Home</a></li>
        <li><a href="contact.html">Support</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h2>StudentHub Portal</h2>
      <p>Log in to manage your classes, view announcements, and stay connected with campus life.</p>
      <form>
        <p>
          <label for="student-id">Student ID</label><br>
          <input type="text" id="student-id" name="student-id" placeholder="S1234567" required>
        </p>
        <p>
          <label for="password">Password</label><br>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </p>
        <p>
          <button type="submit">Log In</button>
          <a href="forgetpass.html">Forgot Password?</a>
        </p>
      </form>
      <p>New to StudentHub? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
