<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub Portal - Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a href="Profile.html">
      <img src="student.png" height="100" width="100">
    </a>
    <div class="logo"><h2>StudentHub</h2></div>
    <nav>
      <ul>
        <li><a href="Home.html">Home</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <div class="login-card">
      <div class="login-panel">
        <h1>Forgot Password</h1>
        <p>Enter your Student ID or registered email address to receive a password reset link.</p>
        <form>
          <div class="form-group">
            <label for="email">Registered Email</label>
            <input type="email" id="email" name="email" placeholder="name@studenthub.edu" required>
          </div>
          <div class="actions">
            <button type="submit" class="btn-primary">Send Reset Link</button>
            <a href="login.html" class="helper-link">Back to login</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
