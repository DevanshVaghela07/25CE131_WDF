    <meta charset="UTF-8">

<header>
    <a href="Profile.html">
        <img src="student.png" height="100" width="100" alt="Student">
    </a>
    <h2 style="color: black;">StudentHub Portal - Sign Up</h2>

    <nav>
        <ul>
            <li><a href="login.html">Login</a></li>
            <li><a href="announcement.html">Announcements</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="calender.html">Calendar</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="registration.html" id="registration">Register</a></li>
            <li><a href="result.html">Results</a></li>
            <li><a href="assignments.html">Assignments</a></li>
        </ul>
    </nav>
</header>

<body>
    <form action="" method="get" id="form">
        <div>
            <label for="firstname">First Name:</label>
            <input type="text" id="firstname" placeholder="Enter your first name" required><span id="s"></span>
        </div>

        <div>
            <label for="middlename">Middle Name:</label>
            <input type="text" id="middlename" placeholder="Enter your middle name"><span id="m"></span>
        </div>

        <div>
            <label for="lastname">Last Name:</label>
            <input type="text" id="lastname" placeholder="Enter your last name" required><span id="l"></span>
        </div>

        <div>
            <label for="id">Student ID:</label>
            <input type="text" id="id" placeholder="Enter your student ID" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="gender">
            <label>Gender:</label>
            <label for="checkbox1">Male</label><input type="radio" id="checkbox1" name="gender" value="male">
            <label for="checkbox2">Female</label><input type="radio" id="checkbox2" name="gender" value="female">
        </div>

        <div>
            <label for="phone">Contact Number:</label>
            <input type="text" id="phone" placeholder="Enter your contact number"><span id="p"></span>
        </div>

        <div>
            <label for="branch">Branch:</label>
            <select id="branch" name="branch" size="1" required>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electrical">Electrical</option>
                <option value="Mechanical">Mechanical</option>
            </select>
        </div>

        <div>
            <label for="area_of_interest">Area of Interest:</label>
            <select id="area_of_interest" name="area_of_interest" size="1" required>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Data Science">Data Science</option>
                <option value="Cybersecurity">Cybersecurity</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
            </select>
        </div>

        <div>
            <label for="address">Address:</label>
            <textarea id="address" name="address" placeholder="Enter your address" cols="30" rows="4"></textarea>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="interest" name="interest">
            <label for="interest">I am interested in receiving updates</label>
        </div>

        <input type="submit" value="Submit" id="btn">
    </form>
    <button class="button-back" onclick="window.location.href='Home.html'">← Back to Home</button>
    <script src="../JS/registration.js"></script>
</body>

</html>
