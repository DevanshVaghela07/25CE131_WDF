<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Sign Up</title>
    <link rel="Stylesheet" href="../CSS/signup.css">
</head>

<header>
    <a href="Profile.html">
        <img src="student.png" height="100" width="100" alt="Student">
    </a>
    <h2 style="color: black;">StudentHub Portal - Sign Up</h2>

    <nav>
        <ul>
            <li><a href="login.html">Login</a></li>
            <li><a href="announcement.html">Announcements</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="calender.html">Calendar</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="signup.html" id="signup">Sign Up</a></li>
            <li><a href="result.html">Results</a></li>
            <li><a href="assignments.html">Assignments</a></li>
        </ul>
    </nav>
</header>

<body>

    <form action="Home.html" method="get">
        <label for="student_id">Student ID:</label><br>
        <input type="text" id="student_id" name="student_id" required>

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" pattern="[a-zA-Z]+" required>

        <label for="department">Department:</label><br>
        <input type="text" id="department" name="department" pattern="[a-zA-Z]+" required>

        <label for="email">Email ID:</label><br>
        <input type="email" id="email" name="email" required>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required>
        <br><br>

        <button type="submit">Submit</button><br>
    </form>
    <button class="button-back" onclick="window.location.href='Home.html'">← Back to Home</button>
    <br><br>
</body>
